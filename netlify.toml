# Netlify configuration.
# The app is built as a static export (next.config.mjs -> output: 'export'),
# which produces an `out/` folder of plain static files. Netlify simply serves
# that directory — no Next.js runtime/adapter required (mirrors the original
# static deployment).
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Long-cache immutable build assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The runtime and game files keep the same URL across deploys, so they must be
# revalidated (cheap 304 via ETag) instead of cached as immutable for a year.
[[headers]]
  for = "/portfolio.runtime.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/game/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
